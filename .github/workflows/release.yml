name: Build and release Windows app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and build dependencies
        shell: pwsh
        run: python -m pip install -e ".[build,gpu-windows]"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Run tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Verify tag and application versions
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $appVersion = python -c "from soop_timeline import __version__; print(__version__)"
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          if ($appVersion.Trim() -ne $tagVersion) {
            throw "태그 버전 $tagVersion 과 앱 버전 $appVersion 이 다릅니다."
          }

      - name: Build EXE, installer, and update manifest
        shell: pwsh
        env:
          SOOP_TIMELINE_INSTALLER_URL: ${{ startsWith(github.ref, 'refs/tags/') && format('https://github.com/32m1nd0t/soop-ai-timeline/releases/download/{0}/SOOPTimeline-Setup.exe', github.ref_name) || '' }}
          SOOP_TIMELINE_PORTABLE_URL: ${{ startsWith(github.ref, 'refs/tags/') && format('https://github.com/32m1nd0t/soop-ai-timeline/releases/download/{0}/SOOPTimeline.exe', github.ref_name) || '' }}
          SOOP_TIMELINE_RELEASE_NOTES: ${{ startsWith(github.ref, 'refs/tags/') && format('SOOP AI 타임라인 {0}', github.ref_name) || '수동 빌드' }}
        run: .\build_installer.ps1

      - name: Smoke-test packaged app
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\SOOPTimeline.exe" -ArgumentList "--smoke-test" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "휴대용 앱 스모크 테스트가 실패했습니다. (exit code: $($process.ExitCode))"
          }

      - name: Smoke-test silent installation
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "SOOPTimeline-install-smoke"
          $setupArgs = @('/SP-', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/NOLAUNCH=1', ("/DIR=`"{0}`"" -f $installDir))
          $setup = Start-Process -FilePath ".\dist\SOOPTimeline-Setup.exe" -ArgumentList $setupArgs -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) {
            throw "설치 프로그램 스모크 테스트가 실패했습니다. (exit code: $($setup.ExitCode))"
          }
          $installed = Start-Process -FilePath (Join-Path $installDir "SOOPTimeline.exe") -ArgumentList "--smoke-test" -WindowStyle Hidden -Wait -PassThru
          if ($installed.ExitCode -ne 0) {
            throw "설치된 앱 스모크 테스트가 실패했습니다. (exit code: $($installed.ExitCode))"
          }
          $uninstall = Start-Process -FilePath (Join-Path $installDir "unins000.exe") -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -WindowStyle Hidden -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "설치 테스트 정리가 실패했습니다. (exit code: $($uninstall.ExitCode))"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SOOPTimeline-Windows
          path: |
            dist/SOOPTimeline.exe
            dist/SOOPTimeline-Setup.exe
            dist/update.json
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/SOOPTimeline-Setup.exe" `
            "dist/SOOPTimeline.exe" `
            "dist/update.json" `
            --title "SOOP AI 타임라인 ${{ github.ref_name }}" `
            --generate-notes
